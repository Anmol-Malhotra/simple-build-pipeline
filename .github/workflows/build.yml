name: Simple Build Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-job:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
    
      - name: Display Start Message
        run: echo "Build Process Started"
    
      - name: Create Build Directory
        run: mkdir -p build
    
      - name: Copy Application File
        run: cp app.txt build/
    
      - name: Display Copied File Contents
        run: cat build/app.txt
    
      - name: Display Completion Message
        run: echo "Build Process Completed Successfully"

